<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#mlBg)" />

  <!-- Neural Network Diagram in Background -->
  <!-- Layer Connections -->
  <g stroke="#3b82f6" stroke-width="1.2" opacity="0.35">
    <!-- Input to Hidden 1 -->
    <line x1="80" y1="120" x2="200" y2="80" />
    <line x1="80" y1="120" x2="200" y2="160" />
    <line x1="80" y1="120" x2="200" y2="240" />
    <line x1="80" y1="200" x2="200" y2="80" />
    <line x1="80" y1="200" x2="200" y2="160" />
    <line x1="80" y1="200" x2="200" y2="240" />
    <line x1="80" y1="280" x2="200" y2="80" />
    <line x1="80" y1="280" x2="200" y2="160" />
    <line x1="80" y1="280" x2="200" y2="240" />

    <!-- Hidden 1 to Hidden 2 -->
    <line x1="200" y1="80" x2="330" y2="110" />
    <line x1="200" y1="80" x2="330" y2="210" />
    <line x1="200" y1="160" x2="330" y2="110" />
    <line x1="200" y1="160" x2="330" y2="210" />
    <line x1="200" y1="240" x2="330" y2="110" />
    <line x1="200" y1="240" x2="330" y2="210" />

    <!-- Hidden 2 to Output -->
    <line x1="330" y1="110" x2="440" y2="160" />
    <line x1="330" y1="210" x2="440" y2="160" />
  </g>

  <!-- Neural Nodes -->
  <!-- Input Nodes -->
  <circle cx="80" cy="120" r="10" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="80" cy="200" r="10" fill="#38bdf8" filter="url(#nodeGlow)" />
  <circle cx="80" cy="280" r="10" fill="#38bdf8" filter="url(#nodeGlow)" />

  <!-- Hidden Nodes 1 -->
  <circle cx="200" cy="80" r="12" fill="#818cf8" filter="url(#nodeGlow)" />
  <circle cx="200" cy="160" r="12" fill="#818cf8" filter="url(#nodeGlow)" />
  <circle cx="200" cy="240" r="12" fill="#818cf8" filter="url(#nodeGlow)" />

  <!-- Hidden Nodes 2 -->
  <circle cx="330" cy="110" r="13" fill="#c084fc" filter="url(#nodeGlow)" />
  <circle cx="330" cy="210" r="13" fill="#c084fc" filter="url(#nodeGlow)" />

  <!-- Output Node -->
  <circle cx="440" cy="160" r="15" fill="#f43f5e" filter="url(#nodeGlow)" />

  <!-- Computer Vision Bounding Box Overlay Card -->
  <g transform="translate(320, 190)">
    <rect width="250" height="160" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Mini photo simulation -->
    <rect x="15" y="15" width="220" height="95" rx="6" fill="#0f172a" />
    <!-- Object detection box -->
    <rect x="35" y="25" width="80" height="70" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="35" y="25" width="60" height="16" fill="#22c55e" />
    <text x="39" y="37" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#0f172a">CLASS: 98.7%</text>

    <!-- Detected faces/features -->
    <circle cx="160" cy="55" r="22" fill="none" stroke="#eab308" stroke-width="1.5" />
    <rect x="135" y="78" width="50" height="12" fill="#eab308" rx="2"/>
    <text x="140" y="87" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#0f172a">FACE: 99.2%</text>

    <!-- Metrics info -->
    <text x="15" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">MODEL: ResNet-50 / PyTorch</text>
    <text x="15" y="146" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">EPOCHS: 100 | LOSS: 0.0142</text>
  </g>
  
  <text x="30" y="45" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#60a5fa">PYTORCH COMPUTER VISION &amp; DEEP LEARNING</text>
</svg>
