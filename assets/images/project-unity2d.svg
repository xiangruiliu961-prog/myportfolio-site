<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dungeonBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dungeon Stone Chamber -->
  <rect width="600" height="380" rx="16" fill="url(#dungeonBg)" />

  <!-- Pixel Brick Pattern Walls -->
  <g fill="#374151" stroke="#1f2937" stroke-width="2">
    <!-- Row 1 -->
    <rect x="20" y="20" width="70" height="30" />
    <rect x="90" y="20" width="70" height="30" />
    <rect x="160" y="20" width="70" height="30" />
    <rect x="230" y="20" width="70" height="30" />
    <rect x="300" y="20" width="70" height="30" />
    <rect x="370" y="20" width="70" height="30" />
    <rect x="440" y="20" width="70" height="30" />
    <rect x="510" y="20" width="70" height="30" />

    <!-- Row 2 -->
    <rect x="0" y="50" width="55" height="30" />
    <rect x="55" y="50" width="70" height="30" />
    <rect x="125" y="50" width="70" height="30" />
    <rect x="195" y="50" width="70" height="30" />
    <rect x="265" y="50" width="70" height="30" />
    <rect x="335" y="50" width="70" height="30" />
    <rect x="405" y="50" width="70" height="30" />
    <rect x="475" y="50" width="70" height="30" />
    <rect x="545" y="50" width="55" height="30" />
  </g>

  <!-- Dungeon Torches -->
  <!-- Left Torch -->
  <circle cx="100" cy="110" r="45" fill="url(#torchGlow)" />
  <rect x="97" y="110" width="6" height="20" fill="#78350f" />
  <polygon points="95,110 100,95 105,110" fill="#f59e0b" />
  <polygon points="98,110 100,100 102,110" fill="#fef08a" />

  <!-- Right Torch -->
  <circle cx="500" cy="110" r="45" fill="url(#torchGlow)" />
  <rect x="497" y="110" width="6" height="20" fill="#78350f" />
  <polygon points="495,110 500,95 505,110" fill="#f59e0b" />
  <polygon points="498,110 500,100 502,110" fill="#fef08a" />

  <!-- Dungeon Floor Platforms -->
  <rect x="0" y="300" width="600" height="80" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
  <!-- Floating Platform -->
  <rect x="200" y="210" width="200" height="22" rx="4" fill="#334155" stroke="#475569" stroke-width="2" />

  <!-- Pixel Knight Hero Character -->
  <g transform="translate(130, 215)">
    <!-- Shadow -->
    <ellipse cx="25" cy="85" rx="20" ry="6" fill="#000000" opacity="0.4"/>
    <!-- Armor Body -->
    <rect x="15" y="45" width="22" height="28" fill="#3b82f6" />
    <!-- Helmet & Visor -->
    <rect x="14" y="20" width="24" height="24" rx="4" fill="#64748b" />
    <rect x="22" y="28" width="16" height="6" fill="#38bdf8" />
    <!-- Legs -->
    <rect x="16" y="73" width="8" height="12" fill="#1e293b" />
    <rect x="28" y="73" width="8" height="12" fill="#1e293b" />
    <!-- Sword -->
    <rect x="38" y="30" width="5" height="40" fill="#f1f5f9" />
    <polygon points="38,30 40.5,20 43,30" fill="#f1f5f9" />
    <rect x="34" y="55" width="13" height="4" fill="#d97706" />
    <!-- Shield -->
    <rect x="5" y="40" width="10" height="26" rx="2" fill="#2563eb" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Treasure Chest on Floating Platform -->
  <g transform="translate(280, 168)">
    <rect x="0" y="18" width="40" height="24" rx="3" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <rect x="0" y="10" width="40" height="12" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <!-- Gold Keyhole -->
    <circle cx="20" cy="22" r="3" fill="#fbbf24" />
    <rect x="19" y="22" width="2" height="5" fill="#fbbf24" />
    <!-- Gold sparkle -->
    <polygon points="46,12 50,8 46,4 42,8" fill="#fef08a" />
    <polygon points="3,6 7,2 3,-2 -1,2" fill="#fef08a" />
  </g>

  <!-- Pixel Slime Enemy -->
  <g transform="translate(440, 245)">
    <ellipse cx="25" cy="55" rx="22" ry="6" fill="#000000" opacity="0.4"/>
    <path d="M 5 50 Q 25 10 45 50 Q 25 58 5 50 Z" fill="#10b981" opacity="0.9" />
    <!-- Eyes -->
    <circle cx="20" cy="38" r="4" fill="#ffffff" />
    <circle cx="21" cy="38" r="2" fill="#064e3b" />
    <circle cx="32" cy="38" r="4" fill="#ffffff" />
    <circle cx="33" cy="38" r="2" fill="#064e3b" />
  </g>

  <!-- UI HUD Elements (Retro Health Bar) -->
  <g transform="translate(25, 20)">
    <rect width="180" height="40" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="12" y="20" font-family="'Courier New', monospace" font-size="11" fill="#f87171" font-weight="bold">HP: 100 / 100</text>
    <!-- Health Bar -->
    <rect x="12" y="26" width="156" height="8" rx="2" fill="#334155" />
    <rect x="12" y="26" width="130" height="8" rx="2" fill="#ef4444" />
  </g>
</svg>
