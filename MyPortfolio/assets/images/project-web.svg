  <text x="512" y="263" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Buy / 구매하기</text>

  <!-- Bottom Interactive Stats Bar -->
  <rect x="155" y="290" width="425" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="175" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ACTIVE USERS / 활성 사용자</text>
  <text x="175" y="342" fill="#22c55e" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">4,820 온라인</text>
  <text x="380" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TOTAL DEALS / 총 성사 거래</text>
  <text x="380" y="342" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">12,490 건</text>
