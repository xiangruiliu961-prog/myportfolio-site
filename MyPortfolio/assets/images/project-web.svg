  <text x="220" y="263" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Buy / 구매하기</text>

  <!-- Product Card 2 -->
  <rect x="300" y="140" width="130" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="310" y="150" width="110" height="60" rx="6" fill="#334155"/>
  <rect x="345" y="165" width="40" height="30" rx="4" fill="#10b981" opacity="0.7"/>
