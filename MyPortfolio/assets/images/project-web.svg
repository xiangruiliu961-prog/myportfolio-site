  <text x="310" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">¥ 120 / ₩ 22,000</text>
  <rect x="310" y="250" width="110" height="18" rx="4" fill="#2563eb" />
  <text x="365" y="263" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Buy / 구매하기</text>

  <!-- Product Card 3 -->
  <rect x="445" y="140" width="135" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="455" y="150" width="115" height="60" rx="6" fill="#334155"/>
  <polygon points="512,165 490,195 535,195" fill="#8b5cf6" opacity="0.7"/>
  <text x="455" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Desk Lamp LED</text>
  <text x="455" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">¥ 28 / ₩ 5,000</text>
