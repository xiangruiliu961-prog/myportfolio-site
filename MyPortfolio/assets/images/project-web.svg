      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#webBg)" />

  <!-- Browser Window Top -->
  <rect width="600" height="38" rx="16" fill="#1e293b" />
  <rect y="24" width="600" height="14" fill="#1e293b" />
  <circle cx="25" cy="19" r="5" fill="#ef4444" />
  <circle cx="42" cy="19" r="5" fill="#f59e0b" />
  <circle cx="59" cy="19" r="5" fill="#10b981" />
  <!-- URL Bar -->
  <rect x="90" y="8" width="420" height="22" rx="11" fill="#0f172a" />
  <text x="300" y="23" fill="#64748b" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">https://campus-hub.univ.edu</text>

  <!-- Left Sidebar Navigation -->
  <rect x="20" y="55" width="120" height="305" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Nav Items -->
