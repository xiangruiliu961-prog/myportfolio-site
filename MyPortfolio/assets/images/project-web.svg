  <text x="45" y="92" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Market / 마켓</text>
  
  <rect x="30" y="112" width="100" height="24" rx="6" fill="#334155" />
  <text x="45" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Chat / 채팅</text>

  <rect x="30" y="146" width="100" height="24" rx="6" fill="#334155" />
  <text x="45" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Forum / 커뮤니티</text>

  <rect x="30" y="180" width="100" height="24" rx="6" fill="#334155" />
  <text x="45" y="196" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Profile / 마이페이지</text>

  <!-- Main Marketplace Items Grid -->
  <!-- Top Banner -->
  <rect x="155" y="55" width="425" height="70" rx="10" fill="url(#blueCard)" />
  <text x="175" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Campus Book &amp; Device Trade / 캠퍼스 거래</text>
  <text x="175" y="108" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="11">Verified student-to-student marketplace / 학생 인증 플랫폼</text>

  <!-- Product Card 1 -->
  <rect x="155" y="140" width="130" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="165" y="150" width="110" height="60" rx="6" fill="#334155"/>
  <circle cx="220" cy="180" r="18" fill="#3b82f6" opacity="0.6"/>
  <text x="165" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Algorithms Textbook</text>
  <text x="165" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">¥ 45 / ₩ 8,000</text>
