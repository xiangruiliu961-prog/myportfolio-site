<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="nlpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#nlpBg)" />

  <!-- Window Header -->
  <rect width="600" height="40" rx="16" fill="#1e293b" />
  <rect y="25" width="600" height="15" fill="#1e293b" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="59" cy="20" r="5" fill="#10b981" />
  <text x="300" y="25" fill="#94a3b8" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">BERT_Sentiment_QA_Service</text>

  <!-- Left Chat / Dialogue Visualizer -->
  <!-- User Speech Bubble -->
  <g transform="translate(30, 60)">
    <rect width="320" height="60" rx="12" fill="url(#bubbleUser)" />
    <text x="18" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">"这款游戏沉浸感很强，剧情非常棒！"</text>
    <text x="18" y="46" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11">"이 게임은 몰입감이 뛰어나고 스토리가 훌륭해요!"</text>
  </g>

  <!-- AI Analysis Breakdown Bubble -->
  <g transform="translate(30, 135)">
    <rect width="320" height="140" rx="12" fill="url(#bubbleAi)" stroke="#475569" stroke-width="1.5"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🤖 NLP Sentiment Analysis / 감정 분석 결과</text>
    
    <!-- Positive score -->
    <text x="18" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Positive / 긍정 지수: 97.8%</text>
    <rect x="18" y="60" width="280" height="8" rx="4" fill="#0f172a" />
    <rect x="18" y="60" width="270" height="8" rx="4" fill="#22c55e" />

    <!-- Keywords extracted -->
    <text x="18" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Keywords / 핵심 키워드:</text>
    <rect x="18" y="100" width="70" height="20" rx="4" fill="#2563eb" />
    <text x="53" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">#沉浸感 / 몰입</text>

    <rect x="96" y="100" width="70" height="20" rx="4" fill="#8b5cf6" />
    <text x="131" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">#剧情棒 / 스토리</text>

    <rect x="174" y="100" width="75" height="20" rx="4" fill="#0284c7" />
    <text x="211" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">#体验佳 / 추천</text>
  </g>

  <!-- Right Side: Attention Weights Heatmap & Model Metrics -->
  <g transform="translate(375, 60)">
    <rect width="195" height="215" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Self-Attention / 어텐션</text>

    <!-- Heatmap Grid -->
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="36" height="24" fill="#3b82f6" opacity="0.9" rx="3"/>
      <rect x="42" y="0" width="36" height="24" fill="#3b82f6" opacity="0.4" rx="3"/>
      <rect x="84" y="0" width="36" height="24" fill="#3b82f6" opacity="0.2" rx="3"/>
      <rect x="126" y="0" width="36" height="24" fill="#3b82f6" opacity="0.7" rx="3"/>

      <rect x="0" y="28" width="36" height="24" fill="#3b82f6" opacity="0.3" rx="3"/>
      <rect x="42" y="28" width="36" height="24" fill="#3b82f6" opacity="0.95" rx="3"/>
      <rect x="84" y="28" width="36" height="24" fill="#3b82f6" opacity="0.5" rx="3"/>
      <rect x="126" y="28" width="36" height="24" fill="#3b82f6" opacity="0.8" rx="3"/>

      <rect x="0" y="56" width="36" height="24" fill="#3b82f6" opacity="0.1" rx="3"/>
      <rect x="42" y="56" width="36" height="24" fill="#3b82f6" opacity="0.6" rx="3"/>
      <rect x="84" y="56" width="36" height="24" fill="#3b82f6" opacity="0.85" rx="3"/>
      <rect x="126" y="56" width="36" height="24" fill="#3b82f6" opacity="0.3" rx="3"/>
    </g>

    <!-- Stats -->
    <text x="15" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">MODEL: BERT-Base Multilingual</text>
    <text x="15" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">F1-SCORE: 96.4%</text>
    <text x="15" y="190" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">LATENCY: 18ms</text>
  </g>

  <!-- Bottom Input Bar Visualizer -->
  <g transform="translate(30, 300)">
    <rect width="540" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">输入待分析文本... / 분석할 텍스트를 입력하세요...</text>
    <rect x="420" y="10" width="105" height="30" rx="6" fill="#2563eb" />
    <text x="472" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">分析 / 분석</text>
  </g>
</svg>
