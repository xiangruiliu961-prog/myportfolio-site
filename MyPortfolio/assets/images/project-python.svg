<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#pyBg)" />

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#1e293b" />
  <rect y="26" width="600" height="16" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <text x="300" y="26" fill="#94a3b8" font-family="'Courier New', monospace" font-size="13" text-anchor="middle">data_analytics_pipeline.py</text>

  <!-- Dashboard Cards -->
  <!-- Left mini stats card -->
  <rect x="30" y="60" width="160" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">DATA SAMPLES / 데이터</text>
  <text x="45" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">1,248,500</text>

  <!-- Middle mini stats card -->
  <rect x="210" y="60" width="160" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="225" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">SPEED / 처리 속도</text>
  <text x="225" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">0.42 ms</text>

  <!-- Right mini stats card -->
  <rect x="390" y="60" width="180" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="405" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">STATUS / 상태</text>
  <text x="405" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">ONLINE</text>

  <!-- Main Chart Canvas -->
  <rect x="30" y="165" width="540" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Grid lines -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="260" x2="540" y2="260" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="310" x2="540" y2="310" stroke="#334155" stroke-width="1.5" />

  <!-- Bar Charts -->
  <rect x="80" y="240" width="22" height="70" rx="4" fill="url(#barGrad1)" />
  <rect x="130" y="210" width="22" height="100" rx="4" fill="url(#barGrad1)" />
  <rect x="180" y="190" width="22" height="120" rx="4" fill="url(#barGrad1)" />
  <rect x="230" y="230" width="22" height="80" rx="4" fill="url(#barGrad1)" />
  <rect x="280" y="180" width="22" height="130" rx="4" fill="url(#barGrad2)" />
  <rect x="330" y="200" width="22" height="110" rx="4" fill="url(#barGrad2)" />
  <rect x="380" y="170" width="22" height="140" rx="4" fill="url(#barGrad2)" />
  <rect x="430" y="195" width="22" height="115" rx="4" fill="url(#barGrad2)" />
  <rect x="480" y="175" width="22" height="135" rx="4" fill="url(#barGrad2)" />

  <!-- Trend Curve Line -->
  <path d="M 80 250 Q 150 170 230 220 T 350 160 T 490 150" fill="none" stroke="url(#accentLine)" stroke-width="3.5" />
  <circle cx="80" cy="250" r="5" fill="#38bdf8" />
  <circle cx="230" cy="220" r="5" fill="#818cf8" />
  <circle cx="350" cy="160" r="5" fill="#c084fc" />
  <circle cx="490" cy="150" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
</svg>
