<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Circle Background -->
  <circle cx="250" cy="250" r="210" fill="url(#bgGrad)" />
  <circle cx="250" cy="250" r="180" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="40s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating Tech Orbits -->
  <g opacity="0.85">
    <circle cx="100" cy="140" r="28" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="100" cy="140" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="146" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">&lt;/&gt;</text>

    <circle cx="400" cy="150" r="30" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="400" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="156" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">AI</text>

    <circle cx="390" cy="360" r="26" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="390" cy="360" r="26" fill="#eff6ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="390" y="366" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0284c7" text-anchor="middle">Unity</text>

    <circle cx="110" cy="360" r="26" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="110" cy="360" r="26" fill="#eff6ff" stroke="#6366f1" stroke-width="2"/>
    <text x="110" y="366" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#4f46e5" text-anchor="middle">Py</text>
  </g>

  <!-- Developer Character Silhouette / Illustration -->
  <g transform="translate(0, 20)">
    <!-- Body & Hoodie -->
    <path d="M 170 380 Q 250 350 330 380 L 350 450 L 150 450 Z" fill="url(#avatarGrad)" />
    <!-- Shirt Collar -->
    <path d="M 220 365 L 250 400 L 280 365 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Neck -->
    <rect x="235" y="315" width="30" height="55" rx="10" fill="#fed7aa" />
    
    <!-- Head -->
    <ellipse cx="250" cy="265" rx="52" ry="60" fill="#fde68a" />
    <!-- Modern Haircut -->
    <path d="M 198 255 C 195 210 230 185 275 190 C 305 195 315 220 305 255 C 295 235 270 230 250 230 C 225 230 210 240 198 255 Z" fill="#1e293b" />
    <path d="M 195 245 Q 185 270 200 285 Q 205 250 215 240 Z" fill="#1e293b" />

    <!-- Glasses -->
    <rect x="215" y="252" width="28" height="18" rx="5" fill="none" stroke="#1e293b" stroke-width="3" />
    <rect x="257" y="252" width="28" height="18" rx="5" fill="none" stroke="#1e293b" stroke-width="3" />
    <line x1="243" y1="261" x2="257" y2="261" stroke="#1e293b" stroke-width="3" />
    <!-- Friendly Smile -->
    <path d="M 238 295 Q 250 305 262 295" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />

    <!-- Laptop base & screen in front -->
    <g transform="translate(160, 360)">
      <polygon points="10,65 170,65 180,75 0,75" fill="#94a3b8" />
      <rect x="25" y="5" width="130" height="60" rx="6" fill="url(#screenGrad)" stroke="#cbd5e1" stroke-width="3" />
      <text x="90" y="40" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;code /&gt;</text>
      <!-- Glowing keyboard trackpad -->
      <rect x="75" y="68" width="30" height="4" rx="2" fill="#cbd5e1" />
    </g>
  </g>
</svg>
